<!DOCTYPE html>
<!-- ===========================================================================
     SORGENTE DI assets/img/apple-touch-icon.png (180 × 180)
     ---------------------------------------------------------------------------
     È l'icona che iOS usa quando qualcuno aggiunge il sito alla schermata home.
     Senza, Apple ritaglia uno screenshot della pagina.

     Per rigenerarla: apri questa pagina, imposta il viewport a 120 × 120
     (a DPR 1,5 il risultato è esattamente 180 × 180) e salva lo screenshot.
     Il disegno arriva da assets/img/favicon.svg: modifica quello, non questo.
     =========================================================================== -->
<html lang="it">
<head>
<meta charset="utf-8">
<title>FR Studio — icona</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; }
  img { display: block; width: 120px; height: 120px; }
</style>
</head>
<body>
<img src="../assets/img/favicon.svg" alt="Icona FR Studio">
</body>
</html>
